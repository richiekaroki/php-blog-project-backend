server {
    listen 8080;
    server_name _;
    root /var/www/html/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Max upload size
    client_max_body_size 10M;

    # Vue SPA (frontend/dist) — fall back to index.html for client-side routes.
    # Crawlers/bots get the server-rendered public/index.php (full HTML) so
    # search engines index the actual content, not the empty #app shell.
    location = / {
        if ($http_user_agent ~* "(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|facebookexternalhit|twitterbot|whatsapp|slackbot|linkedinbot|pinterest|redditbot|semrushbot|ahrefsbot|mj12bot|dotbot|rogerbot|curl|wget|python-requests|scrapy|ia_archiver|archive\.org_bot)") {
            rewrite ^ /index.php last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP backend API
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Uploaded images live in the PHP public dir
    location ^~ /uploads/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    # PHP admin/site stylesheets live in the PHP public dir. Exact-match so
    # they don't shadow the Vue SPA's built assets (frontend/dist/assets),
    # which share the /assets/ prefix.
    location = /assets/admin.css {
        root /var/www/html/public;
    }
    location = /assets/site.css {
        root /var/www/html/public;
    }

    # Vue SPA built assets (hashed bundles, fonts) — served from the dist root.
    location /assets/ {
        root /var/www/html/frontend/dist;
        try_files $uri =404;
    }

    # Sitemap generated by PHP (public/sitemap.php) under the conventional .xml URL
    location = /sitemap.xml {
        root /var/www/html/public;
        rewrite ^ /sitemap.php last;
    }

    # PHP-FPM handler (server-rendered pages, admin, API)
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
    }
    location ~ /\.git {
        deny all;
    }
    location ~ /composer\.(json|lock) {
        deny all;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
