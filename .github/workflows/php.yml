name: PHP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Install PHPUnit
        run: composer install --dev --no-interaction

      - name: Create database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php -r '$p = new PDO("pgsql:host=localhost;port=5432;dbname=postgres","postgres","postgres"); $p->exec("CREATE DATABASE mizzle_backend");'

      - name: Run Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: mizzle_backend
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: prefer
        run: php bin/migrate.php

      - name: Run Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: mizzle_backend
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/phpunit tests/

      - name: Code Sniff (PHP CodeSniffer)
        if: false
        run: |
          composer global require phpunit/phpunit 2>/dev/null || true
          # Skipped for simplicity - would need php-cs-fixer installed

      - name: Lint PHP Files
        run: php -l $(find . -name '*.php' | grep -v vendor | grep -v '.github')

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,vue}" "eslint.config.js" ".prettierrc.json"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Deployment is handled by Render's automatic deploy on push to main
  # (autoDeployTrigger on the service), so no deploy job is needed here.